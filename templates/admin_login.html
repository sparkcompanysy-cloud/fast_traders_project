<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Traders | بوابة الإدارة المشفرة (Admin Login)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #0B0E14; color: #fff; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    {% if messages %}
    <div id="toastContainer" class="fixed top-5 left-5 right-5 sm:right-auto z-50 space-y-2">
        {% for message in messages %}
        <div class="px-5 py-3 rounded-xl font-bold text-xs sm:text-sm shadow-2xl flex items-center gap-2 {% if message.tags == 'error' %}bg-red-500 text-white{% else %}bg-[#00ECB9] text-[#0B0E14]{% endif %}">
            <i class="fa-solid {% if message.tags == 'error' %}fa-triangle-exclamation{% else %}fa-circle-check{% endif %}"></i>
            <span>{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    <script>setTimeout(() => { const el = document.getElementById('toastContainer'); if (el) el.remove(); }, 4000);</script>
    {% endif %}

    <div class="w-full max-w-md bg-[#121824] border border-[#F0B90B]/30 rounded-2xl p-6 sm:p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-[#F0B90B]/15 border border-[#F0B90B]/40 text-[#F0B90B] flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg shadow-[#F0B90B]/10">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div class="flex items-center justify-center gap-1.5 text-lg font-black mb-1">
                <i class="fa-solid fa-bolt text-[#F0B90B]"></i> Fast<span class="text-[#00ECB9]">Traders</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-black text-white">بوابة الإدارة المشفرة</h1>
            <p class="text-xs text-gray-400 mt-1">يرجى إدخال بيانات المدير (Superuser) للوصول إلى مركز التحكم</p>
        </div>

        <form method="POST" action="{% url 'admin_login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-xs text-gray-400 block mb-1.5">اسم المستخدم أو البريد الإلكتروني</label>
                <div class="relative">
                    <i class="fa-solid fa-user-lock absolute right-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input name="username" type="text" value="{{ form.username.value|default:'' }}" required placeholder="أدخل اسم المستخدم للمدير" autocomplete="off" class="w-full bg-[#0B0E14] border border-white/15 rounded-xl pr-10 pl-4 py-3 text-sm focus:border-[#F0B90B] outline-none">
                </div>
            </div>
            <div>
                <label class="text-xs text-gray-400 block mb-1.5">كلمة المرور</label>
                <div class="relative">
                    <i class="fa-solid fa-key absolute right-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input name="password" type="password" required placeholder="••••••••" class="w-full bg-[#0B0E14] border border-white/15 rounded-xl pr-10 pl-4 py-3 text-sm focus:border-[#F0B90B] outline-none">
                </div>
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-[#F0B90B] text-[#0B0E14] font-black text-sm hover:opacity-90 transition shadow-lg shadow-[#F0B90B]/20">
                <i class="fa-solid fa-unlock-keyhole ml-1"></i> فتح لوحة التحكم المركزية
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-white/10 text-center">
            <a href="{% url 'index' %}" class="text-xs text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-arrow-right ml-1"></i> العودة للصفحة الرئيسية
            </a>
        </div>
    </div>
</body>
</html>
